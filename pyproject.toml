[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "r4dsg"
version = "0.1.0"
description = "Relative 4D scene graph memory from cached egocentric observations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "R4DSG contributors"}]
keywords = ["egocentric-video", "scene-graph", "episodic-memory", "retrieval"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[project.urls]
Paper = "https://arxiv.org/abs/2608.11017"
Homepage = "https://dualtransparency.github.io/R4DSG/"
Repository = "https://github.com/dualtransparency/R4DSG-code"
Issues = "https://github.com/dualtransparency/R4DSG-code/issues"

[project.scripts]
r4dsg = "r4dsg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
